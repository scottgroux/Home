<!DOCTYPE html>

<body>

  <!-- ── Sidebar ── -->

      <div class="name">Scott Groux</div>

    <nav>
      <a href="index.html" class="nav-link">

        Home
      </a>

      <div class="nav-section">
        <div class="nav-section-label open" id="writing-toggle" onclick="toggleWriting()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>

        <div class="nav-sub open" id="writing-sub">
          <a href="editorials.html" class="nav-link">Editorials</a>

        </div>
      </div>

      <a href="videos.html" class="nav-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>

      </a>
      <a href="resume.html" class="nav-link active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>

      </a>

    <div class="sidebar-footer">© 2026 Scott Groux</div>

  <main class="main">

    <section class="resume-hero">
      <h1>Resume</h1>
      <p>An 8.5"x11" of relevant experiences. Download a copy. Share it with your friends.</p>
      <!-- Update href to point to your actual PDF once uploaded -->
      <a class="resume-download" href="scott-groux-resume.pdf" download>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

      </a>
    </section>

    <div class="resume-body" style="max-width: 100%; padding: 32px 64px 80px;">
      <iframe src="scott-groux-resume.pdf" width="100%" height="900px" style="border: none; border-radius: 4px;" title="Scott Groux Resume">
        <p>Your browser can't display the PDF inline. 
          <a href="scott-groux-resume.pdf">Download it here instead.</a>
        </p>
      </iframe>
    </div>
  </main>

  <script>
    function toggleWriting() {
      const toggle = document.getElementById('writing-toggle');
      const sub    = document.getElementById('writing-sub');
      toggle.classList.toggle('open');
      sub.classList.toggle('open');
    }
  </script>
